apiVersion: elastic.iml.github.io/v1alpha1
kind: ElasticJob
metadata:
  name: llama70b-colossalai
  namespace: dlrover
spec:
  distributionStrategy: AllreduceStrategy
  optimizeMode: single-job
  replicaSpecs:
    worker:
      restartCount: 3
      replicas: 2
      template:
        spec:
          hostNetwork: true
          hostIPC: true
          hostPID: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            metax-tech.com/gpu.product: "MXC500"
            dlrover/tag: "true"
          restartPolicy: Always
          containers:
            - name: main
              image: 10.107.204.168/metax/cloud/dlrover/llama70b:0.3.7_v5
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
                - "/gpfs/userdata/m00915/colossalai_train/colossalai_train/k8s_test_32c.sh"
              resources:
                limits:
                  metax-tech.com/gpu: 8
                requests:
                  cpu: 64
              securityContext:
                privileged: true
                capabilities:
                  add:
                    - NET_ADMIN
              volumeMounts:
                - name: shm-volume  # share-memory setting
                  mountPath: /dev/shm
                - name: nfs
                  mountPath: /gpfs
          volumes:
          - name: shm-volume
            emptyDir:
              medium: Memory
              sizeLimit: 100Gi
          - name: nfs
            hostPath:
              path: /gpfs
              type: Directory
